<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Interactive robot path, footprint, and cleaning gadget visualization.">
    <title>Kärcher Robotics Challenge — Data Visualization</title>
    <link rel="stylesheet" href="styles.css">
    <script src="visualization.js?v=13" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">Kärcher · Robotics Coding Challenge</p>
        <h1>Robot data visualization</h1>
        <p class="intro">Hover over or focus a point to inspect its values.</p>
      </header>

      <p id="status" class="status" role="status">Loading visualization…</p>
      <p id="path-length" class="path-length" aria-live="polite" hidden></p>
      <p id="cleaned-area" class="path-length" aria-live="polite" hidden></p>
      <p id="traversal-time" class="path-length" aria-live="polite" hidden></p>

      <section class="plots" aria-label="Robot path visualization">
        <article class="plot-card">
          <h2>Robot path <span class="frame-tag">world frame · m</span></h2>
          <p id="current-speed" class="current-speed" role="status" aria-live="polite" hidden></p>
          <div class="plot-wrap">
            <svg id="path-plot" class="plot" viewBox="0 0 700 560" role="img" aria-label="Robot waypoints in the world frame"></svg>
            <div class="tooltip" role="status" hidden></div>
          </div>
        </article>
      </section>

      <footer>Data source: <code>data/short.json</code></footer>
    </main>
  </body>
</html>
